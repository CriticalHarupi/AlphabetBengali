apiVersion: batch/v1
kind: Job
metadata:
  name: test-data
  namespace: alphabetbengali
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test-data
          image: asia-northeast1-docker.pkg.dev/project-b8ee474a-9624-49ce-b08/alphabetbengali/test:${IMAGE_TAG}
          command: ["go", "test", "./data/..."]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
