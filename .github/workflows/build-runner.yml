name: Build Runner Image

on:
  push:
    paths:
      - 'runner/Dockerfile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/581223007151/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@project-b8ee474a-9624-49ce-b08.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build and push runner image
        working-directory: runner
        run: |
          docker build -t asia-northeast1-docker.pkg.dev/project-b8ee474a-9624-49ce-b08/alphabetbengali/runner:latest .
          docker push asia-northeast1-docker.pkg.dev/project-b8ee474a-9624-49ce-b08/alphabetbengali/runner:latest
