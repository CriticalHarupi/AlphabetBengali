name: Test (handlers)

on:
  push:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: go-test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Test
        working-directory: backend
        run: go test ./handlers/...
