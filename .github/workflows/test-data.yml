name: Test (data)

on:
  push:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build test image
        working-directory: backend
        run: docker build --target test -t test-image .

      - name: Test
        run: docker run --rm test-image go test ./data/...
