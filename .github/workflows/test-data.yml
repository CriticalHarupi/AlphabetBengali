name: Test (data)

on:
  push:
    paths:
      - 'backend/**'

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/581223007151/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@project-b8ee474a-9624-49ce-b08.iam.gserviceaccount.com

      - name: Configure kubectl
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: alphabetbengali
          location: asia-northeast1-a

      - name: Build test image
        working-directory: backend
        run: docker build --target test -t asia-northeast1-docker.pkg.dev/project-b8ee474a-9624-49ce-b08/alphabetbengali/test:${IMAGE_TAG} .

      - name: Push test image
        run: docker push asia-northeast1-docker.pkg.dev/project-b8ee474a-9624-49ce-b08/alphabetbengali/test:${IMAGE_TAG}

      - name: Run test job
        run: envsubst < k8s/test-data-job.yml | kubectl apply -f -
